services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # All values come from the project root `.env` (see docker-compose.env.example).
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in root .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Set MYSQL_DATABASE in root .env}"
      MYSQL_USER: "${MYSQL_USER:?Set MYSQL_USER in root .env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY: "1"
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in root .env (use a long random string)}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost}"
      SELLER_USERNAMES: "${SELLER_USERNAMES:?Set SELLER_USERNAMES in root .env}"
      SELLER_PASSWORDS: "${SELLER_PASSWORDS:?Set SELLER_PASSWORDS in root .env}"
      SCANNER_USERNAMES: "${SCANNER_USERNAMES:?Set SCANNER_USERNAMES in root .env}"
      SCANNER_PASSWORDS: "${SCANNER_PASSWORDS:?Set SCANNER_PASSWORDS in root .env}"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  db_data:
