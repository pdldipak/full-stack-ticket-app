[build]
  # Tell Netlify to go into the frontend folder to run the build
  base = "frontend"
  # The command to create the production files
  command = "npm run build"
  # The folder Vite creates after building
  publish = "dist"

[[redirects]]
  from = "/auth/*"
  to = "http://161.35.200.119/auth/:splat"
  status = 200
  force = true

# Do NOT proxy /tickets/* to the API. React uses /tickets, /tickets/new, /tickets/detail/:code
# — a full page load must serve index.html. API calls use VITE_API_URL (see [build.environment]).

[[redirects]]
  from = "/public/*"
  to = "http://161.35.200.119/public/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "http://161.35.200.119/health"
  status = 200
  force = true

[[redirects]]
  # This fixes the "404 on refresh" issue for React Router
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  # Repo root path; build base is "frontend" but functions live under frontend/netlify/functions
  directory = "frontend/netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Same-origin API via serverless proxy — avoids clashing with React Router paths under /tickets
  VITE_API_URL = "/.netlify/functions/api"