[build]
  # Tell Netlify to go into the frontend folder to run the build
  base = "frontend"
  # The command to create the built static files
  command = "npm run build"
  # The folder Vite creates after building
  publish = "dist"

# Same-origin API under /api — avoids clashing with React routes (/tickets, /tickets/detail/…).
# (Netlify Functions only run at /.netlify/functions/<name> with no extra path segments, so /api/* proxy is used instead.)
[[redirects]]
  from = "/api/*"
  to = "http://161.35.200.119/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "http://161.35.200.119/health"
  status = 200
  force = true

[[redirects]]
  # SPA: do not proxy /tickets/* to the API (see comment above).
  from = "/*"
  to = "/index.html"
  status = 200

# Avoid stale JSON for ticket lists (304 + empty body confusion in devtools).
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Mitigate XSS impact (JWT remains in localStorage; CSP limits script sources).
# theme-boot.js replaces inline script so script-src can stay 'self' only.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; media-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    X-Content-Type-Options = "nosniff"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "/api"
