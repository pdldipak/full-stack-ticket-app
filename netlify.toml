[build]
  # Tell Netlify to go into the frontend folder to run the build
  base = "frontend"
  # The command to create the production files
  command = "npm run build"
  # The folder Vite creates after building
  publish = "dist"

[[redirects]]
  from = "/auth/*"
  to = "http://161.35.200.119/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tickets/*"
  to = "http://161.35.200.119/tickets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/public/*"
  to = "http://161.35.200.119/public/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "http://161.35.200.119/health"
  status = 200
  force = true

[[redirects]]
  # This fixes the "404 on refresh" issue for React Router
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"